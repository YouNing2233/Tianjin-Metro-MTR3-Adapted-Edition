# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx5G
# 国内访问 Cloudflare 前置的 maven（architectury / shedaniel / fabricmc）时 TLS 握手可能长时间挂起。
# Loom 会为每个 mod 依赖发 HEAD 请求找 -sources.jar，一旦挂起会让整个构建看起来"死住"。
# 连接超时设小一点让它快速失败；但 socket 超时要给足——maven.minecraftforge.net 很慢，
# 每个包可能要几分钟才下完，socket 超时太小会把正常的下载掐断。
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=600000
# Mod Properties
mod_version=1.1.3.2-EXP
maven_group=ziyue.tjmetro
mtr_version=3.2.2