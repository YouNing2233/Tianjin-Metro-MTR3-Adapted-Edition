name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# 说明：
#   本仓库是 Architectury 多模块结构，每个 MC 版本一个独立子项目
#   （fabric / fabric-1.18.2 / ... / forge-1.20.1 / neoforge-1.21.1），
#   构建时需要 MTR / NeoMTR 的 jar。这些 jar 受上游许可限制，不随仓库分发，
#   因此 CI 通过仓库变量 MTR_JARS_ARCHIVE_URL（包含全部所需 jar 的 zip 直链）
#   在构建前拉取到 mtr-jars/，再用 -PmtrJarDir 指给 Gradle。
#   需要在压缩包里的文件（12 个，按需即可）：
#     MTR-fabric-1.16.5-3.2.2-hotfix-1.jar   MTR-forge-1.16.5-3.2.2-hotfix-1.jar
#     MTR-fabric-1.18.2-3.2.2-hotfix-1.jar   MTR-forge-1.18.2-3.2.2-hotfix-1.jar
#     MTR-fabric-1.19.2-3.2.2-hotfix-1.jar   MTR-forge-1.19.2-3.2.2-hotfix-1.jar
#     MTR-fabric-1.19.4-3.2.2-hotfix-1.jar   MTR-forge-1.19.4-3.2.2-hotfix-1.jar
#     MTR-fabric-1.20.1-3.6.2.2.jar         MTR-forge-1.20.1-3.6.2.2.jar
#     NeoMTR-300.6.1+1.21.1+fabric.jar       NeoMTR-300.6.1+1.21.1+neoforge.jar

jobs:
  build:
    name: ${{ matrix.module }} (${{ matrix.mc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1.20.1 - MTR 3.6.2.2
          - { module: fabric,           mc: "1.20.1", java: "21" }
          - { module: forge,            mc: "1.20.1", java: "21" }
          # 1.19.4 - MTR 3.2.2-hotfix-1
          - { module: fabric-1.19.4,    mc: "1.19.4", java: "21" }
          - { module: forge-1.19.4,     mc: "1.19.4", java: "21" }
          # 1.19.2 - MTR 3.2.2-hotfix-1
          - { module: fabric-1.19.2,    mc: "1.19.2", java: "21" }
          - { module: forge-1.19.2,     mc: "1.19.2", java: "21" }
          # 1.18.2 - MTR 3.2.2-hotfix-1
          - { module: fabric-1.18.2,    mc: "1.18.2", java: "21" }
          - { module: forge-1.18.2,     mc: "1.18.2", java: "21" }
          # 1.16.5 - MTR 3.2.2-hotfix-1
          - { module: fabric-1.16.5,    mc: "1.16.5", java: "21" }
          - { module: forge-1.16.5,     mc: "1.16.5", java: "21" }
          # 1.21.1 - NeoMTR 300.6.1
          - { module: fabric-1.21.1,    mc: "1.21.1", java: "21" }
          - { module: neoforge-1.21.1,  mc: "1.21.1", java: "21" }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ matrix.mc }}-${{ hashFiles('**/*.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Stage MTR jars
        env:
          MTR_JARS_ARCHIVE_URL: ${{ vars.MTR_JARS_ARCHIVE_URL }}
        run: |
          set -euo pipefail
          mkdir -p mtr-jars
          if [ -n "${MTR_JARS_ARCHIVE_URL:-}" ]; then
            curl -fsSL "$MTR_JARS_ARCHIVE_URL" -o /tmp/mtr-jars.zip
            unzip -o -j /tmp/mtr-jars.zip -d mtr-jars
          fi
          missing=0
          for jar in \
            MTR-fabric-1.16.5-3.2.2-hotfix-1.jar MTR-forge-1.16.5-3.2.2-hotfix-1.jar \
            MTR-fabric-1.18.2-3.2.2-hotfix-1.jar MTR-forge-1.18.2-3.2.2-hotfix-1.jar \
            MTR-fabric-1.19.2-3.2.2-hotfix-1.jar MTR-forge-1.19.2-3.2.2-hotfix-1.jar \
            MTR-fabric-1.19.4-3.2.2-hotfix-1.jar MTR-forge-1.19.4-3.2.2-hotfix-1.jar \
            MTR-fabric-1.20.1-3.6.2.2.jar MTR-forge-1.20.1-3.6.2.2.jar \
            "NeoMTR-300.6.1+1.21.1+fabric.jar" "NeoMTR-300.6.1+1.21.1+neoforge.jar"; do
            [ -f "mtr-jars/$jar" ] || { echo "::warning::missing mtr-jars/$jar"; missing=$((missing+1)); }
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::缺少 MTR jar，请设置仓库变量 MTR_JARS_ARCHIVE_URL（见本 workflow 顶部注释）"
            exit 1
          fi

      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build ${{ matrix.module }}
        run: ./gradlew :${{ matrix.module }}:build -PmtrJarDir="$PWD/mtr-jars" --stacktrace

      - name: Collect artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tjmetro-${{ matrix.module }}-${{ matrix.mc }}
          path: build/*.jar
          if-no-files-found: warn
