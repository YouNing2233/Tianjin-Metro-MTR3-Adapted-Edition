name: Build

on:
  workflow_dispatch:
  push:
    branches: [main, beta]

permissions:
  contents: read

env:
  # 1.20.1 时代的 MTR 3.6.2.2（实为 YMTR 分支）没有公开发布渠道，挂在本仓库的 Release 上。
  MTR_LIBS_TAG: mtr-libs-1.0.0

jobs:
  build:
    name: ${{ matrix.mod }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mod: fabric,           common: common,           mtr: modrinth }
          - { mod: forge,            common: common,           mtr: modrinth }
          - { mod: fabric-1.16.5,    common: common-1.16.5,    mtr: modrinth }
          - { mod: forge-1.16.5,     common: common-1.16.5,    mtr: modrinth }
          - { mod: fabric-1.17.1,    common: common-1.17.1,    mtr: modrinth }
          - { mod: forge-1.17.1,     common: common-1.17.1,    mtr: modrinth }
          - { mod: fabric-1.18.2,    common: common-1.18.2,    mtr: modrinth }
          - { mod: forge-1.18.2,     common: common-1.18.2,    mtr: modrinth }
          - { mod: fabric-1.19.2,    common: common-1.19.2,    mtr: modrinth }
          - { mod: forge-1.19.2,     common: common-1.19.2,    mtr: modrinth }
          - { mod: fabric-1.19.4,    common: common-1.19.4,    mtr: modrinth }
          - { mod: forge-1.19.4,     common: common-1.19.4,    mtr: modrinth }
          - { mod: fabric-1.21.1,    common: common-1.21.1,    mtr: modrinth }
          - { mod: neoforge-1.21.1,  common: common-1.21.1,    mtr: modrinth }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Stage MTR / NeoMTR jars
        run: |
          set -euo pipefail
          mkdir -p mtr-jars
          cd mtr-jars
          dl() { echo "==> $2"; curl -fSL --retry 5 --retry-delay 3 -o "$2" "$1"; }

          # MTR 3.2.2-hotfix-1（Modrinth 官方 CDN，文件名与 build.gradle 完全一致）
          dl "https://cdn.modrinth.com/data/XKPAmI6u/versions/YoiezDVD/MTR-fabric-1.16.5-3.2.2-hotfix-1.jar" "MTR-fabric-1.16.5-3.2.2-hotfix-1.jar"
          dl "https://cdn.modrinth.com/data/XKPAmI6u/versions/wT190mxx/MTR-fabric-1.17.1-3.2.2-hotfix-1.jar" "MTR-fabric-1.17.1-3.2.2-hotfix-1.jar"
          dl "https://cdn.modrinth.com/data/XKPAmI6u/versions/KD7TXFaw/MTR-fabric-1.18.2-3.2.2-hotfix-1.jar" "MTR-fabric-1.18.2-3.2.2-hotfix-1.jar"
          dl "https://cdn.modrinth.com/data/XKPAmI6u/versions/H0yHV2yE/MTR-fabric-1.19.2-3.2.2-hotfix-1.jar" "MTR-fabric-1.19.2-3.2.2-hotfix-1.jar"
          dl "https://cdn.modrinth.com/data/XKPAmI6u/versions/UT2U5yfn/MTR-fabric-1.19.4-3.2.2-hotfix-1.jar" "MTR-fabric-1.19.4-3.2.2-hotfix-1.jar"

          # NeoMTR 300.6.1+1.21.1（Modrinth）
          dl "https://cdn.modrinth.com/data/xilU2EKS/versions/1jZyPnjl/NeoMTR-300.6.1%2B1.21.1%2Bfabric.jar" "NeoMTR-300.6.1+1.21.1+fabric.jar"
          dl "https://cdn.modrinth.com/data/xilU2EKS/versions/Eo1RNucl/NeoMTR-300.6.1%2B1.21.1%2Bneoforge.jar" "NeoMTR-300.6.1+1.21.1+neoforge.jar"

          # MTR 3.6.2.2 for 1.20.1：本仓库 Release 资产
          dl "https://github.com/${GITHUB_REPOSITORY}/releases/download/${MTR_LIBS_TAG}/MTR-fabric-1.20.1-3.6.2.2.jar" "MTR-fabric-1.20.1-3.6.2.2.jar"
          dl "https://github.com/${GITHUB_REPOSITORY}/releases/download/${MTR_LIBS_TAG}/MTR-forge-1.20.1-3.6.2.2.jar" "MTR-forge-1.20.1-3.6.2.2.jar"

          ls -l

      - name: Narrow settings.gradle for ${{ matrix.mod }}
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  maven { url = uri("https://maven.architectury.dev/") }
                  maven { url = uri("https://maven.fabricmc.net/") }
                  maven { url = uri("https://maven.minecraftforge.net/") }
                  maven { url = uri("https://maven.neoforged.net/releases/") }
              }
          }
          include("__COMMON__")
          include("__MOD__")
          rootProject.name = "Tianjin-Metro"
          EOF
          sed -i 's/__COMMON__/${{ matrix.common }}/; s/__MOD__/${{ matrix.mod }}/' settings.gradle
          cat settings.gradle

      - name: Build
        run: ./gradlew ":${MOD}:build" -PmtrJarDir="$PWD/mtr-jars" --stacktrace --console=plain
        env:
          MOD: ${{ matrix.mod }}

      - name: Collect jar
        run: |
          mkdir -p out
          find build -maxdepth 1 -name "TianjinMetro-*.jar" -exec cp {} out/ \;
          if [ -z "$(ls -A out)" ]; then
            find . -path ./mtr-jars -prune -o -name "*.jar" -print | grep -E "build/libs/.*-[0-9].*\.jar$" | grep -v sources | head -20
          fi
          ls -l out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.mod }}
          path: out/*.jar
          if-no-files-found: warn
