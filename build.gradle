subprojects {
    apply plugin: "dev.architectury.loom"

    // 1.19.4、1.19.2 和 1.18.2 子项目使用独立版本配置
    def isLegacy1194 = project.name == "fabric-1.19.4" || project.name == "forge-1.19.4" || project.name == "common-1.19.4"
    def isLegacy1192 = project.name == "fabric-1.19.2" || project.name == "forge-1.19.2" || project.name == "common-1.19.2"
    def isLegacy1182 = project.name == "fabric-1.18.2" || project.name == "forge-1.18.2" || project.name == "common-1.18.2"
    def isLegacy1165 = project.name == "fabric-1.16.5" || project.name == "forge-1.16.5" || project.name == "common-1.16.5"
    def isLegacy1211 = project.name == "fabric-1.21.1" || project.name == "neoforge-1.21.1" || project.name == "common-1.21.1"
    def isNeoForge1211 = project.name == "neoforge-1.21.1"
    def isForge = project.name == "forge" || project.name == "forge-1.19.4" || project.name == "forge-1.19.2" || project.name == "forge-1.18.2" || project.name == "forge-1.16.5"
    def isCommon = project.name == "common" || project.name == "common-1.19.4" || project.name == "common-1.19.2" || project.name == "common-1.18.2" || project.name == "common-1.21.1" || project.name == "common-1.16.5"
    def subMcVersion = isLegacy1211 ? minecraft_version_1211 : (isLegacy1194 ? minecraft_version_1194 : (isLegacy1192 ? minecraft_version_1192 : (isLegacy1182 ? minecraft_version_1182 : (isLegacy1165 ? minecraft_version_1165 : minecraft_version))))
    // 根据平台和版本选择对应的 MTR jar
    def subMtrJar
    if (isNeoForge1211) {
        subMtrJar = neomtr_jar_neoforge_1211
    } else if (isLegacy1211) {
        subMtrJar = neomtr_jar_1211
    } else if (isForge) {
        if (isLegacy1194) {
            subMtrJar = "../${mtr_forge_jar_1194}"
        } else if (isLegacy1192) {
            subMtrJar = "E:/Project/MTRjars/${mtr_forge_jar_1192}"
        } else if (isLegacy1182) {
            subMtrJar = "../${mtr_forge_jar_1182}"
        } else if (isLegacy1165) {
            subMtrJar = mtr_forge_jar_1165
        } else {
            subMtrJar = "E:/Project/MTRjars/MTR-forge-1.20.1-3.6.2.2.jar"
        }
    } else {
        if (isLegacy1194) {
            subMtrJar = "../${mtr_jar_1194}"
        } else if (isLegacy1192) {
            subMtrJar = "E:/Project/MTRjars/${mtr_jar_1192}"
        } else if (isLegacy1182) {
            subMtrJar = "../${mtr_jar_1182}"
        } else if (isLegacy1165) {
            subMtrJar = mtr_jar_1165
        } else {
            subMtrJar = "E:/Project/MTRjars/MTR-fabric-1.20.1-3.6.2.2.jar"
        }
    }
    project.ext.subMinecraftVersion = subMcVersion
    project.ext.subMtrJar = subMtrJar
    project.ext.subFabricLoaderVersion = isLegacy1194 ? fabric_loader_version_1194 : (isLegacy1192 ? fabric_loader_version_1192 : (isLegacy1182 ? fabric_loader_version_1182 : rootProject.fabric_loader_version))
    project.ext.subFabricApiVersion = isLegacy1194 ? fabric_api_version_1194 : (isLegacy1192 ? fabric_api_version_1192 : (isLegacy1182 ? fabric_api_version_1182 : rootProject.fabric_api_version))
    project.ext.subModMenuVersion = isLegacy1194 ? mod_menu_version_1194 : (isLegacy1192 ? mod_menu_version_1192 : (isLegacy1182 ? mod_menu_version_1182 : rootProject.mod_menu_version))
    project.ext.subClothConfigVersion = isLegacy1194 ? cloth_config_fabric_version_1194 : (isLegacy1192 ? cloth_config_fabric_version_1192 : (isLegacy1182 ? cloth_config_fabric_version_1182 : rootProject.cloth_config_fabric_version))
    project.ext.subIsLegacy1194 = isLegacy1194
    project.ext.subIsLegacy1192 = isLegacy1192
    project.ext.subIsLegacy1182 = isLegacy1182
    project.ext.subIsForge = isForge
    project.ext.subForgeVersion = isLegacy1194 ? forge_version_1194 : (isLegacy1192 ? forge_version_1192 : (isLegacy1182 ? forge_version_1182 : rootProject.forge_version))
    project.ext.subArchitecturyVersion = isLegacy1194 ? architectury_version_1194 : (isLegacy1192 ? architectury_version_1192 : (isLegacy1182 ? architectury_version_1182 : rootProject.architectury_version))
    project.ext.subClothConfigForgeVersion = isLegacy1194 ? cloth_config_forge_version_1194 : (isLegacy1192 ? cloth_config_forge_version_1192 : (isLegacy1182 ? cloth_config_forge_version_1182 : rootProject.cloth_config_forge_version))

    // 1.16.5 子项目覆盖默认值。
    // 关键差异：Architectury 在该版本仍发布在 me.shedaniel 组下，所以用 subArchitecturyId 区分；
    // MC 1.16.5 还要求 Java 8 字节码（见 JavaCompile 配置）。
    if (isLegacy1165) {
        project.ext.subFabricLoaderVersion = fabric_loader_version_1165
        project.ext.subFabricApiVersion = fabric_api_version_1165
        project.ext.subModMenuVersion = mod_menu_version_1165
        project.ext.subClothConfigVersion = cloth_config_fabric_version_1165
        project.ext.subArchitecturyVersion = architectury_version_1165
        project.ext.subForgeVersion = forge_version_1165
        project.ext.subClothConfigForgeVersion = cloth_config_forge_version_1165
        project.ext.subIsLegacy1165 = true
    }
    project.ext.subArchitecturyId = isLegacy1165 ? "me.shedaniel" : "dev.architectury"

    // 1.21.1 子项目覆盖上面的默认值（NeoMTR + MC 1.21.1 工具链）
    if (isLegacy1211) {
        project.ext.subFabricLoaderVersion = fabric_loader_version_1211
        project.ext.subFabricApiVersion = fabric_api_version_1211
        project.ext.subModMenuVersion = mod_menu_version_1211
        project.ext.subClothConfigVersion = isNeoForge1211 ? cloth_config_neoforge_version_1211 : cloth_config_fabric_version_1211
        project.ext.subArchitecturyVersion = architectury_version_1211
        project.ext.subForgeVersion = neoforge_version_1211
        project.ext.subClothConfigForgeVersion = cloth_config_neoforge_version_1211
        project.ext.subIsLegacy1211 = true
        project.ext.subIsNeoForge1211 = isNeoForge1211
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${subMcVersion}"
        mappings loom.officialMojangMappings()
        modImplementation files(subMtrJar)
        // common-1.19.4、common-1.19.2 和 common-1.18.2 需要 fabric-loader 和 architectury 依赖
        if (isCommon && isLegacy1194) {
            modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version_1194}"
            modApi "dev.architectury:architectury:${architectury_version_1194}"
            modApi("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_fabric_version_1194}") {
                exclude(group: "net.fabricmc.fabric-api")
            }
        }
        if (isCommon && isLegacy1192) {
            modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version_1192}"
            modApi "dev.architectury:architectury:${architectury_version_1192}"
            modApi("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_fabric_version_1192}") {
                exclude(group: "net.fabricmc.fabric-api")
            }
        }
        if (isCommon && isLegacy1182) {
            modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version_1182}"
            modApi "dev.architectury:architectury:${architectury_version_1182}"
            modApi("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_fabric_version_1182}") {
                exclude(group: "net.fabricmc.fabric-api")
            }
        }
        if (isCommon && isLegacy1165) {
            // 1.16.5 时期 Architectury 的组名是 me.shedaniel，不是 dev.architectury
            modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version_1165}"
            modApi "me.shedaniel:architectury:${architectury_version_1165}"
            modApi("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_fabric_version_1165}") {
                exclude(group: "net.fabricmc.fabric-api")
            }
            // MTR 1.16.5 的 BlockEntityClientSerializableMapper 实现了
            // net.fabricmc.fabric.api.block.entity.BlockEntityClientSerializable，
            // 而 Architectury 1.x 的 BlockEntityExtension 也继承自它。
            // 这个接口在 1.16.5 时代位于 fabric-networking-blockentity-v0 模块（1.18 起已从 fabric-api 移除）。
            // 注意：不要用 compileOnly "net.fabricmc.fabric-api:fabric-api:0.42.0+1.16"——那个聚合 jar 只是
            // 个 6 条目的空壳，且 modCompileOnly 会让 Loom 去为全部子模块拉 sources，国内网络下会卡很久。
            modCompileOnly "net.fabricmc.fabric-api:fabric-networking-blockentity-v0:0.2.9+3cc0f0907d"
        }
        if (isCommon && isLegacy1211) {
            modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version_1211}"
            modApi "dev.architectury:architectury:${architectury_version_1211}"
            modApi("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_fabric_version_1211}") {
                exclude(group: "net.fabricmc.fabric-api")
            }
        }
    }
}

task setupLibrary() {
    doLast {
        download {
            src "https://www.minecrafttransitrailway.com/libs/${rootProject.mtr_version}/MTR-common-${minecraft_version}-${rootProject.mtr_version}-dev.jar"
            dest "checkouts/mtr-common.jar"
            overwrite true
        }

        download {
            src "https://www.minecrafttransitrailway.com/libs/${rootProject.mtr_version}/MTR-fabric-${minecraft_version}-${rootProject.mtr_version}-dev-shadow.jar"
            dest "checkouts/mtr-fabric.jar"
            overwrite true
        }

        download {
            src "https://www.minecrafttransitrailway.com/libs/${rootProject.mtr_version}/MTR-forge-${minecraft_version}-${rootProject.mtr_version}-dev-shadow.jar"
            dest "checkouts/mtr-forge.jar"
            overwrite true
        }
    }
}

task setupFiles() {
    System.out.println("Fabric Loader: " + rootProject.fabric_loader_version)
    System.out.println("Forge: " + rootProject.forge_version)
    System.out.println("Fabric API: " + rootProject.fabric_api_version)
    System.out.println("Mod Menu: " + rootProject.mod_menu_version)
    System.out.println("Architectury: " + rootProject.architectury_version)

    copy {
        outputs.upToDateWhen { false }
        from "E:/Project/MTRjars/MTR-fabric-1.20.1-3.6.2.2.jar"
        into "fabric/run/mods"
    }

    copy {
        outputs.upToDateWhen { false }
        from "common/src/main/latest-tjmetro.json"
        into "build/latest"
        filter(ReplaceTokens, tokens: ["version": rootProject.mod_version])
    }
}

allprojects {
    // 所有子项目都使用 architectury-plugin
    apply plugin: "architectury-plugin"

    version = minecraft_version + "-" + project.mod_version
    group = project.maven_group

    repositories {
        // 本地 maven 仓库：存放国内各镜像都拿不到、且官方源极慢的构件
        // （目前是 net.minecraftforge:forge 1.16.5 的 pom + jar + installer/userdev/sources classifier）。
        // 必须放在最前面，否则 Gradle 会在 BMCLAPI 找到模块描述符后只去 BMCLAPI 找构件，
        // 而 BMCLAPI 对 GET 请求返回 JS 反爬页。
        maven { url = uri("file:///E:/Project/Tianjin-metro-MTR3/tools/local-maven") }
        // Forge 1.16.5 的 dev 依赖（cpw.mods:modlauncher、net.minecraftforge:* 等）只在官方 maven 上，
        // 国内各镜像都没有。官方源很慢，但这些都是几百 KB 的小包，配合 gradle.properties 里的长 socket 超时可以下完。
        maven { url = "https://maven.minecraftforge.net/" }
        // 国内网络下 maven.fabricmc.net / maven.neoforged.net 会直接超时或 Connection reset，
        // BMCLAPI 提供同路径的国内镜像。这里先声明，稍后由下方 projectsEvaluated 提升到首位。
        maven { url = "https://bmclapi2.bangbang93.com/maven/" }
        maven { url = "https://maven.neoforged.net/releases/" }
        maven { url = "https://maven.aliyun.com/repository/public" }
        maven { url = "https://jitpack.io/" }
        maven { url = "https://maven.terraformersmc.com/" }
        maven { url = "https://maven.shedaniel.me/" }
        maven { url = "https://maven.ziyuesinicization.site/releases/" }
        maven { url = "https://api.modrinth.com/maven" }
    }

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"

        // 每个子项目按自己的 MC 版本决定字节码目标：
        //   1.16.5 → 17（沿用与本模组其它版本一致的 Java 17；注意这要求游戏运行在 Java 17+，
        //            Forge 1.16.5 官方只支持 Java 8，若要在 Java 8 上跑需另行降级语法）
        //   1.18–1.20 → 17，1.21+ → 21
        def subMcVersionForRelease = project.hasProperty("subMinecraftVersion") ? project.subMinecraftVersion : minecraft_version
        def subMinorForRelease = subMcVersionForRelease.split("\\.")[1] as int
        if (subMinorForRelease == 16 && (subMcVersionForRelease.split("\\.")[2] as int) == 5) {
            options.release = 17
        } else if (subMinorForRelease == 16 || subMinorForRelease == 17) {
            options.release = 16
        } else if (subMinorForRelease >= 21) {
            options.release = 21
        } else {
            options.release = 17
        }
    }

    afterEvaluate {
        for (def task in it.tasks) {
            if (task != rootProject.tasks.setupFiles) {
                task.dependsOn rootProject.tasks.setupFiles
            }
        }
    }
}

// 注意：Loom 会在 afterEvaluate 阶段就把 maven.fabricmc.net 解析进仓库列表并可能已触发解析，
// 因此无法在这里重排仓库顺序。国内网络下请先用 tools/cache-warm 预热 Gradle 共享缓存，
// 之后以 --offline 构建（见 README-1.21.1.md）。

static def getModrinthVersion(loader, minecraftVersion, projectId) {
    def versionsArray = new JsonSlurper().parse(("https://api.modrinth.com/v2/project/" + projectId + "/version").toURL())
    for (def versionElement : versionsArray) {
        if (versionElement["loaders"].contains(loader) && versionElement["game_versions"].contains(minecraftVersion)) {
            return versionElement["version_number"]
        }
    }
    return ""
}
