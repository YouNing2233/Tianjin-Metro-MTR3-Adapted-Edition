plugins {
    id "com.github.johnrengelman.shadow"
}

loom {
    forge {
        mixinConfig "tjmetro.mixins.json"
        mixinConfig "tjmetro.forge.mixins.json"
    }
    mixin {
        defaultRefmapName = "forge-forge-refmap.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.forge_version}"
    modApi "${rootProject.architectury_id}:architectury-forge:${rootProject.architectury_version}"
    modApi "me.shedaniel.cloth:cloth-config-forge:${rootProject.cloth_config_forge_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive = false }
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/mods.toml") {
        expand "version": project.mod_version
    }
}

shadowJar {
    exclude "fabric.mod.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

task moveForgeBuilds() {
    doLast {
        delete fileTree("../build").matching {
            include "**/TianjinMetro-forge-1.20.1*"
        }
        copy {
            from "build/libs"
            into "../build"
            exclude "*dev-shadow.jar"
            rename "(.+)", "TianjinMetro-\$1"
        }
    }
}

afterEvaluate {
    for (def task in it.tasks) {
        if (task == tasks.build) {
            task.finalizedBy tasks.moveForgeBuilds
        }
    }
}
